script_name: non_matching_boundary
generate_data: false
make_plots: true
iterations: 10
problem_params:
  T: 1.0
  c: 1.0
training:
  epochs: 200000
  max_training_time: 1200.0
  learning_rate:
    kind: exponential_decay
    init_value: 0.0001
    transition_steps: 1000
    decay_rate: 0.95
    staircase: true
  seed: 42
  log_every: 500
  optimiser: adamw
  convergence_check: false
  use_jit: true
integration:
  kind: monte_carlo
  spatial_dim: 1
  x_min: 0.0
  x_max: 1.0
  t_min: 0.0
  t_max: 1.0
  monte_carlo:
    interior_samples: 20000
    boundary_samples: 2000
callback_integration:
  kind: quadrature
  spatial_dim: 1
  x_min: 0.0
  x_max: 1.0
  t_min: 0.0
  t_max: 1.0
  quadrature:
    degree: 5
    grid_size: 50
combinations:
- - pinn
  - mlp
- - fosls
  - mlp
- - vpinn
  - mlp
models:
  mlp:
    hidden_dim: 64
    num_layers: 5
  mlp_V0:
    hidden_dim: 64
    num_layers: 5
methods:
  pinn:
    output_heads:
      u: 1
    ic_weight: 1.0
    bc_weight: 100.0
  fosls:
    output_heads:
      v: 1
      sigma: 1
    ic_weight: 1.0
  vpinn:
    output_heads:
      u: 1
    ic_weight: 1.0
    bc_weight: 10.0
    n_test_functions: 400
plot_params:
  t_grid: 100
  x_grid: 100
plot_fosls_loss:
  show_error: true
  error_low: 0
  error_high: 100
  size_windowed_average: 100
plot_specific_t:
  show_error: true
  error_low: 0
  error_high: 100
